name: Build nightly APK

on:
  push:
    branches: [build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Build
        run: >
          ./gradlew assembleMainlineNopebble --stacktrace
          -Dnightly_store_file="$RUNNER_TEMP/keystore.p12"
          -Dnightly_store_password="${{ secrets.KEYSTOREPASS }}"
          -Dnightly_key_alias="gadgetbridge"
          -Dnightly_key_password="${{ secrets.KEYPASS }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-nightly
          path: app/build/outputs/apk/**/*.apk
